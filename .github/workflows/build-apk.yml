name: Build TODO APP (APK)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find the project folder (works even if files are inside an extra folder)
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            ZIP=$(find . -maxdepth 3 -iname "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -n "$ZIP" ]; then
              echo "No project files found - unzipping $ZIP"
              mkdir -p _project
              unzip -q -o "$ZIP" -d _project
              SETTINGS=$(find _project -name settings.gradle | head -n 1)
            fi
          fi
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found, and no usable zip file in the repo."
            find . -maxdepth 3 -not -path "./.git/*" | head -50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project folder: $DIR"
          ls -la "$DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create signing key if it is missing
        run: |
          if [ ! -f "$PROJECT_DIR/app/todoapp.jks" ]; then
            keytool -genkeypair -keystore "$PROJECT_DIR/app/todoapp.jks" -alias todoapp -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass todoapp123 -keypass todoapp123 -dname "CN=TODO APP, O=TODO APP, C=US"
          fi

      # Optional: bundle JS libraries for offline use (skipped if the script is missing or fails)
      - name: Download libraries for offline use (optional)
        continue-on-error: true
        run: |
          if [ -f "$PROJECT_DIR/scripts/fetch-libs.sh" ]; then
            bash "$PROJECT_DIR/scripts/fetch-libs.sh"
          else
            echo "scripts/fetch-libs.sh not found - skipping (app will load libraries online)"
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" -name "*.apk" | head -n 1)
          echo "APK: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/TODO-APP.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TODO-APP-apk
          path: TODO-APP.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
